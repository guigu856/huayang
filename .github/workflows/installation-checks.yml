name: Installation checks

on:
  pull_request:
    paths:
      - "install.sh"
      - "install.ps1"
      - "video_create_plugin/installation.py"
      - "video_create_plugin/admin/__main__.py"
      - "tests/test_installation_cli.py"
      - "tests/test_install_sh.py"
      - ".github/workflows/installation-checks.yml"
  push:
    branches: [main]
    paths:
      - "install.sh"
      - "install.ps1"
      - "video_create_plugin/installation.py"
      - "video_create_plugin/admin/__main__.py"
      - "tests/test_installation_cli.py"
      - "tests/test_install_sh.py"
      - ".github/workflows/installation-checks.yml"

jobs:
  installation-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync test dependencies
        run: uv sync --extra dev

      - name: Validate Unix installer syntax
        if: runner.os != 'Windows'
        shell: bash
        run: bash -n install.sh

      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Run installation tests
        run: uv run pytest tests/test_installation_cli.py tests/test_install_sh.py

      - name: Collect Ruff diagnostics
        id: ruff
        continue-on-error: true
        run: uv run ruff check video_create_plugin/installation.py video_create_plugin/admin/__main__.py tests/test_installation_cli.py tests/test_install_sh.py --output-format=json --output-file=ruff-results.json

      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-${{ runner.os }}
          path: ruff-results.json
          if-no-files-found: error

      - name: Enforce Ruff result
        if: steps.ruff.outcome == 'failure'
        shell: bash
        run: |
          cat ruff-results.json
          exit 1

      - name: Collect mypy diagnostics
        id: mypy
        continue-on-error: true
        shell: bash
        run: uv run mypy video_create_plugin/installation.py video_create_plugin/admin/__main__.py --show-error-codes > mypy-results.txt 2>&1

      - name: Upload mypy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-${{ runner.os }}
          path: mypy-results.txt
          if-no-files-found: error

      - name: Enforce mypy result
        if: steps.mypy.outcome == 'failure'
        shell: bash
        run: |
          cat mypy-results.txt
          exit 1
