[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "huayang"
version = "0.1.0"
description = "Huayang 视频创作插件与 Agent 可调用组件"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "lancedb>=0.25,<1",
    "mcp>=1.27,<2",
    "numpy>=2.2,<3",
    "pillow>=11,<13",
    "playwright>=1.60,<2",
    "pydantic>=2.9,<3",
    "python-multipart>=0.0.20,<1",
    "pyyaml>=6.0,<7",
    "uvicorn>=0.34,<1",
    "yt-dlp>=2026.6.9",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "ruff>=0.7,<1",
    "types-beautifulsoup4",
    "types-PyYAML",
    "types-yt-dlp",
]

[project.scripts]
material-acquisition = "components.material_acquisition.__main__:main"
video-download = "components.video_download.__main__:main"
video-editor = "components.video_editor.__main__:main"
huayang = "video_create_plugin.admin.__main__:main"
huayang-mcp = "video_create_plugin.mcp.server:main"

[tool.setuptools.packages.find]
include = ["components*", "video_create_plugin*"]

[tool.setuptools.package-data]
"components.video_editor" = ["web/*"]
"video_create_plugin.admin" = ["web/*"]

[tool.setuptools.data-files]
"share/huayang" = [".mcp.json"]
"share/huayang/.claude-plugin" = [".claude-plugin/plugin.json"]
"share/huayang/.codex-plugin" = [".codex-plugin/plugin.json"]
"share/huayang/rules" = ["rules/main-agent.md"]
"share/huayang/rules/common" = ["rules/common/*.md"]
"share/huayang/rules/creation" = ["rules/creation/*.md"]
"share/huayang/rules/reference-study" = ["rules/reference-study/*.md"]
"share/huayang/schemas" = ["schemas/*.json"]
"share/huayang/skills/audiovisual-relation-analysis" = ["skills/audiovisual-relation-analysis/SKILL.md"]
"share/huayang/skills/bgm-preparation" = ["skills/bgm-preparation/SKILL.md"]
"share/huayang/skills/creative-direction" = ["skills/creative-direction/SKILL.md"]
"share/huayang/skills/editing-grammar-synthesis" = ["skills/editing-grammar-synthesis/SKILL.md"]
"share/huayang/skills/editing-specification" = ["skills/editing-specification/SKILL.md"]
"share/huayang/skills/execution-project-authoring" = ["skills/execution-project-authoring/SKILL.md"]
"share/huayang/skills/material-preparation" = ["skills/material-preparation/SKILL.md"]
"share/huayang/skills/reference-bgm-analysis" = ["skills/reference-bgm-analysis/SKILL.md"]
"share/huayang/skills/reference-study" = ["skills/reference-study/SKILL.md"]
"share/huayang/skills/reference-visual-analysis" = ["skills/reference-visual-analysis/SKILL.md"]
"share/huayang/skills/render-inspection" = ["skills/render-inspection/SKILL.md"]
"share/huayang/skills/video-task-router" = ["skills/video-task-router/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = [
    "components.material_acquisition",
    "components.video_download",
    "components.video_editor",
    "components.video_analysis",
    "components.audio_analysis",
    "components.bgm_acquisition",
    "components.image_acquisition",
    "components.media_preprocessing",
    "components.render_inspection",
    "video_create_plugin",
]
