[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "video-create-components"
version = "0.1.0"
description = "供 Agent 调用的视频创作组件"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "playwright>=1.60,<2",
    "pydantic>=2.9,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
    "yt-dlp>=2026.6.9",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "ruff>=0.7,<1",
    "types-beautifulsoup4",
    "types-yt-dlp",
]

[project.scripts]
material-acquisition = "components.material_acquisition.__main__:main"
video-download = "components.video_download.__main__:main"
video-editor = "components.video_editor.__main__:main"

[tool.setuptools.packages.find]
include = ["components*"]

[tool.setuptools.package-data]
"components.video_editor" = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["components.material_acquisition", "components.video_download", "components.video_editor"]
